name: "✨ 機能要望"
description: 新しい機能や改善案を提案する
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 解決したい課題
      description: どのような点を改善したいか教えてください。
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 提案する解決策・欲しい機能
      description: どのような機能があれば課題を解決できるか教えてください。
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 代替案（もしあれば）
      description: 他に検討した案があれば記入してください。